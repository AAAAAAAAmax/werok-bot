<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>小蝾螈 werok · 超级百科</title>
    <style>
        :root{
            --bg: #0f141f; --card-bg: #1a2335; --input-bg: #242f44; --text: #e8e8e8;
            --accent: #66ccff; --btn: #2984ff; --btn-hover: #1e70e0;
            --chat-user: #2984ff; --chat-bot: #354357; --shadow: rgba(0,0,0,0.3);
            --border: rgba(102,204,255,0.15);
        }
        .light-mode{
            --bg: #f0f4f8; --card-bg: #ffffff; --input-bg: #f5f7fa; --text: #2d3748;
            --accent: #2b6cb0; --btn: #3182ce; --btn-hover: #2c5282;
            --chat-user: #3182ce; --chat-bot: #edf2f7; --shadow: rgba(0,0,0,0.1);
            --border: rgba(49,130,206,0.2);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;transition:background-color 0.3s,color 0.3s}
        body{background:linear-gradient(135deg,var(--bg) 0%,var(--card-bg) 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;position:relative;overflow-x:hidden}
        .card{width:100%;max-width:580px;background:var(--card-bg);border-radius:22px;padding:30px;box-shadow:0 10px 40px var(--shadow);border:1px solid var(--border);position:relative;z-index:1}
        .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:15px}
        .tool-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--input-bg);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .tool-btn:hover{background:var(--btn);color:#fff;transform:scale(1.1)}
        .tool-btn.active{background:var(--btn);color:#fff}
        h1{text-align:center;color:var(--accent);margin-bottom:25px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none}
        h1 .icon{font-size:28px;animation:bounce 2s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .chat-area{background:var(--input-bg);border-radius:15px;padding:15px;margin-bottom:15px;max-height:300px;overflow-y:auto;display:none}
        .chat-area.active{display:block}
        .chat-msg{margin-bottom:12px;animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .chat-msg.user{text-align:right;color:#fff}
        .chat-msg.user span{background:var(--chat-user);padding:8px 14px;border-radius:15px 15px 0 15px;display:inline-block;max-width:80%;word-wrap:break-word}
        .chat-msg.bot{text-align:left;color:var(--text)}
        .chat-msg.bot span{background:var(--chat-bot);padding:8px 14px;border-radius:15px 15px 15px 0;display:inline-block;max-width:80%;word-wrap:break-word}
        .chat-msg .time{font-size:11px;color:#888;margin-top:3px;display:block}
        .input-area{display:flex;gap:10px;align-items:flex-end}
        textarea{flex:1;height:50px;max-height:120px;background:var(--input-bg);border:1px solid var(--border);border-radius:15px;outline:none;color:var(--text);padding:12px 15px;font-size:15px;resize:none;overflow-y:auto}
        textarea:focus{border-color:var(--btn);box-shadow:0 0 0 3px rgba(41,132,255,0.15)}
        .send-btn{padding:12px 20px;border:none;border-radius:12px;background:var(--btn);color:#fff;font-size:15px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all 0.2s}
        .send-btn:hover{background:var(--btn-hover);transform:scale(1.02)}.send-btn:active{transform:scale(0.98)}
        #ans{margin-top:15px;padding:18px;background:var(--input-bg);border-radius:15px;color:var(--text);line-height:1.8;min-height:60px;animation:fadeIn 0.3s ease;position:relative}
        .speak-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--accent);cursor:pointer;font-size:18px;opacity:0.6;transition:opacity 0.2s}
        .speak-btn:hover{opacity:1}
        .quick-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;margin-bottom:5px}
        .quick-btn{padding:6px 12px;border-radius:20px;background:rgba(41,132,255,0.15);color:var(--accent);border:1px solid var(--border);font-size:13px;cursor:pointer;transition:0.2s;white-space:nowrap}
        .quick-btn:hover{background:rgba(41,132,255,0.3);border-color:var(--btn);transform:translateY(-1px)}
        .fun-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
        .fun-btn{padding:6px 12px;border-radius:20px;background:rgba(255,107,157,0.15);color:#ff9ec4;border:1px solid rgba(255,107,157,0.2);font-size:13px;cursor:pointer;transition:0.2s;white-space:nowrap}
        .fun-btn:hover{background:rgba(255,107,157,0.3);border-color:#ff9ec4;transform:translateY(-1px)}
        .toggle-history{text-align:right;margin-bottom:10px;font-size:12px;color:var(--accent);cursor:pointer;user-select:none}.toggle-history:hover{text-decoration:underline}
        .chat-area::-webkit-scrollbar{width:5px}.chat-area::-webkit-scrollbar-track{background:transparent}.chat-area::-webkit-scrollbar-thumb{background:rgba(102,204,255,0.3);border-radius:3px}
        .emoji-rain{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
        .emoji-drop{position:absolute;font-size:30px;animation:fall linear forwards}
        @keyframes fall{0%{transform:translateY(-100px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
        .typing-indicator{display:inline-block;margin-left:5px}
        .typing-indicator span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 2px;animation:typingDot 0.6s infinite alternate}
        .typing-indicator span:nth-child(2){animation-delay:0.2s}.typing-indicator span:nth-child(3){animation-delay:0.4s}
        @keyframes typingDot{from{opacity:0.3;transform:scale(0.8)}to{opacity:1;transform:scale(1.2)}}
        .sticker-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.3s ease}
        .sticker-content{background:var(--card-bg);border-radius:20px;padding:25px;text-align:center;max-width:400px;width:90%;border:1px solid var(--border)}
        .sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
        .sticker-item{font-size:35px;cursor:pointer;transition:transform 0.2s;padding:5px}.sticker-item:hover{transform:scale(1.3)}.sticker-item.locked{opacity:0.3;filter:grayscale(1);cursor:not-allowed}
        .close-btn{margin-top:10px;padding:8px 20px;border-radius:10px;border:none;background:var(--btn);color:#fff;cursor:pointer}
        .game-area{background:var(--input-bg);border-radius:15px;padding:15px;margin-top:10px;text-align:center;color:var(--text);display:none}
        .game-area.active{display:block;animation:fadeIn 0.3s ease}
        .game-input{width:80px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);text-align:center;font-size:18px;margin:10px 0}
        .game-btn{padding:8px 16px;border-radius:8px;border:none;background:var(--btn);color:#fff;cursor:pointer;margin:0 5px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--btn);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:2000;animation:toastIn 0.3s ease,toastOut 0.3s ease 1.5s forwards}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0}}
        @media (max-width:480px){.card{padding:18px}.quick-btns,.fun-btns{gap:5px}.quick-btn,.fun-btn{padding:5px 10px;font-size:12px}h1{font-size:18px}}
    </style>
</head>
<body>
<div class="emoji-rain" id="emojiRain"></div>
<div class="card">
    <div class="toolbar">
        <button class="tool-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌓</button>
        <button class="tool-btn" id="soundBtn" onclick="toggleSound()" title="音效开关">🔊</button>
        <button class="tool-btn" onclick="showStickers()" title="贴纸收藏">🌟</button>
        <button class="tool-btn" onclick="startGame()" title="猜数字游戏">🎮</button>
    </div>
    <h1 id="title" onclick="triggerEmojiRain('💕🦎✨💙🌟',20)"><span class="icon">🦎</span> 小蝾螈 werok <span class="icon">💕</span></h1>
    <div class="toggle-history" id="toggleHistory" onclick="toggleChatHistory()">📜 显示对话记录</div>
    <div class="chat-area" id="chatArea"></div>
    <div class="game-area" id="gameArea">
        <p>🎯 <strong>猜数字游戏</strong></p><p style="font-size:13px;color:#888;">我想了一个 1-100 的数字~</p>
        <input type="number" class="game-input" id="gameInput" min="1" max="100" placeholder="?"><br>
        <button class="game-btn" onclick="guessNumber()">猜！</button>
        <button class="game-btn" onclick="closeGame()" style="background:#666;">关闭</button>
        <p id="gameHint" style="margin-top:10px;font-size:14px;"></p><p id="gameCount" style="font-size:12px;color:#888;"></p>
    </div>
    <div class="input-area">
        <textarea id="txt" placeholder="和软乎乎的小蝾螈说说话吧～文学、历史、数理化、汽车、情歌我全都懂哦！" rows="1"></textarea>
        <button class="send-btn" onclick="ask()"><span>✨</span> 发送</button>
    </div>
    <div class="quick-btns">
        <span class="quick-btn" onclick="quickAsk('你是谁')">🤔 你是谁</span>
        <span class="quick-btn" onclick="quickAsk('王磊是谁')">👨‍💻 王磊</span>
        <span class="quick-btn" onclick="quickAsk('讲个笑话')">😂 笑话</span>
        <span class="quick-btn" onclick="quickAsk('猜个谜语')">🧩 谜语</span>
        <span class="quick-btn" onclick="quickAsk('说句情话')">💌 情话</span>
        <span class="quick-btn" onclick="quickAsk('怎么煎鸡蛋')">🍳 厨艺</span>
        <span class="quick-btn" onclick="quickAsk('玫瑰花语')">🌹 花草</span>
        <span class="quick-btn" onclick="quickAsk('咖啡种类')">☕ 饮品</span>
        <span class="quick-btn" onclick="quickAsk('最快的车')">🚗 汽车</span>
        <span class="quick-btn" onclick="quickAsk('蝴蝶吃什么')">🦋 昆虫</span>
        <span class="quick-btn" onclick="quickAsk('勾股定理')">📐 数学</span>
        <span class="quick-btn" onclick="quickAsk('元素周期表')">🧪 化学</span>
        <span class="quick-btn" onclick="quickAsk('牛顿定律')">🍎 物理</span>
        <span class="quick-btn" onclick="quickAsk('三国演义')">🏯 三国</span>
        <span class="quick-btn" onclick="quickAsk('孙子兵法')">📜 兵法</span>
        <span class="quick-btn" onclick="quickAsk('马斯克传')">🚀 马斯克</span>
    </div>
    <div class="fun-btns">
        <span class="fun-btn" onclick="quickAsk('我今天很开心')">😊 开心</span>
        <span class="fun-btn" onclick="quickAsk('我有点难过')">😢 难过</span>
        <span class="fun-btn" onclick="quickAsk('好无聊啊')">🥱 无聊</span>
        <span class="fun-btn" onclick="quickAsk('掷骰子')">🎲 骰子</span>
        <span class="fun-btn" onclick="quickAsk('石头剪刀布')">✊ 猜拳</span>
        <span class="fun-btn" onclick="quickAsk('唱首情歌')">🎤 情歌</span>
        <span class="fun-btn" onclick="quickAsk('儿歌')">🐸 儿歌</span>
        <span class="fun-btn" onclick="quickAsk('你这个小笨蛋')">🤬 可爱骂</span>
        <span class="fun-btn" onclick="showMoodDiary()">📔 心情</span>
    </div>
    <div id="ans">咕噜～我是软乎乎的美西螈小蝾螈werok💕<button class="speak-btn" onclick="speakText(this.parentElement.textContent)" title="朗读">🔊</button></div>
</div>

<script>
// ==================== 全局状态 ====================
let inp = document.getElementById('txt');
let out = document.getElementById('ans');
let chatArea = document.getElementById('chatArea');
let toggleHistory = document.getElementById('toggleHistory');
let chatHistory = [];
let showHistory = false;
let soundEnabled = true;
let isLightMode = localStorage.getItem('werok-theme') === 'light';
let stickerCollection = JSON.parse(localStorage.getItem('werok-stickers') || '[]');
let gameTarget = 0, gameGuesses = 0;
const allStickers = ['🦎','💕','✨','🌟','💙','🎉','🫂','🌈','🍀','🎀','🦋','🌸','🍬','💫','🫧','🐾'];

// 记忆系统
let userMemory = JSON.parse(localStorage.getItem('werok-memory') || '{}');
function saveMemory(key, value){
    userMemory[key] = value;
    localStorage.setItem('werok-memory', JSON.stringify(userMemory));
}
function rememberName(text){
    let match = text.match(/(?:我叫|我是|我的名字是|称呼我|叫我)\s*([\u4e00-\u9fa5a-zA-Z0-9]{1,10})/);
    if(match){
        let name = match[1];
        saveMemory('username', name);
        return name;
    }
    return null;
}

// 复制贴纸
function copySticker(emoji){
    navigator.clipboard.writeText(emoji).then(() => showToast('已复制贴纸 ' + emoji));
}

// 主题、音效、Toast
function applyTheme(){
    document.body.classList.toggle('light-mode', isLightMode);
    document.getElementById('themeBtn').textContent = isLightMode ? '☀️' : '🌙';
}
applyTheme();
function toggleTheme(){
    isLightMode = !isLightMode;
    localStorage.setItem('werok-theme', isLightMode ? 'light' : 'dark');
    applyTheme();
    showToast(isLightMode ? '切换到白天模式 ☀️' : '切换到夜间模式 🌙');
}
function toggleSound(){
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    document.getElementById('soundBtn').classList.toggle('active', !soundEnabled);
    showToast(soundEnabled ? '音效已开启 🔊' : '音效已关闭 🔇');
}
function showToast(msg){
    let toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg;
    document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000);
}

let lastAudioCtxTime = 0;
function playTone(freq, type='sine', duration=0.1, rampDown=true){
    if(!soundEnabled) return;
    let now = Date.now();
    if(now - lastAudioCtxTime < 30) return;
    lastAudioCtxTime = now;
    try{
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = type; gain.gain.value = 0.1;
        if(rampDown) gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    }catch(e){}
}
function playClickSound(){ playTone(800); }
function playSendSound(){
    if(!soundEnabled) return;
    let now = Date.now();
    if(now - lastAudioCtxTime < 30) return;
    lastAudioCtxTime = now;
    try{
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 600; osc.type = 'sine'; gain.gain.value = 0.12;
        osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    }catch(e){}
}

// 表情雨
function triggerEmojiRain(emojiStr, count=20){
    let container = document.getElementById('emojiRain');
    let emojis = [...emojiStr];
    for(let i = 0; i < count; i++){
        setTimeout(() => {
            let drop = document.createElement('span'); drop.className = 'emoji-drop';
            drop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            drop.style.left = Math.random() * 95 + '%';
            drop.style.fontSize = (20 + Math.random() * 40) + 'px';
            drop.style.animationDuration = (2 + Math.random() * 3) + 's';
            container.appendChild(drop);
            setTimeout(() => drop.remove(), 3500);
        }, i * 80);
    }
    playClickSound();
}

// 贴纸系统
function showStickers(){
    let existing = document.querySelector('.sticker-modal'); if(existing) existing.remove();
    let collectedCount = stickerCollection.length;
    let modal = document.createElement('div'); modal.className = 'sticker-modal';
    modal.innerHTML = `<div class="sticker-content">
        <h3 style="color:var(--accent);">🌟 贴纸收藏册</h3><p style="font-size:13px;color:#888;">已收集 ${collectedCount}/${allStickers.length}</p>
        <div class="sticker-grid">${allStickers.map(s => {
            let locked = !stickerCollection.includes(s);
            return `<span class="sticker-item ${locked ? 'locked' : ''}" onclick="${locked ? '' : 'copySticker(\''+s+'\')'}" title="${locked ? '???' : s}">${locked ? '❓' : s}</span>`;
        }).join('')}</div>
        <p style="font-size:12px;color:#888;">多和小蝾螈聊天解锁新贴纸哦～</p>
        <button class="close-btn" onclick="this.closest('.sticker-modal').remove()">关闭</button></div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e){ if(e.target === modal) modal.remove(); });
    playClickSound();
}
function unlockSticker(emoji){
    if(!stickerCollection.includes(emoji)){
        stickerCollection.push(emoji);
        localStorage.setItem('werok-stickers', JSON.stringify(stickerCollection));
        showToast(`🎉 解锁新贴纸：${emoji}`);
        triggerEmojiRain(emoji + '🌟✨', 10);
    }
}
let interactionCount = parseInt(localStorage.getItem('werok-interactions') || '0');
function incrementInteractions(){
    interactionCount++;
    localStorage.setItem('werok-interactions', interactionCount);
    if(interactionCount % 5 === 0 && stickerCollection.length < allStickers.length){
        let locked = allStickers.filter(s => !stickerCollection.includes(s));
        if(locked.length > 0){
            let newSticker = locked[Math.floor(Math.random() * locked.length)];
            setTimeout(() => unlockSticker(newSticker), 500);
        }
    }
}

// 心情日记
function showMoodDiary(){
    let moods = ['😊 超开心','🙂 还不错','😐 一般般','😢 有点难过','😡 很生气'];
    let moodEmojis = ['😊','🙂','😐','😢','😡'];
    let modal = document.createElement('div'); modal.className = 'sticker-modal';
    modal.innerHTML = `<div class="sticker-content">
        <h3 style="color:var(--accent);">📔 今天心情如何？</h3>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0;">
            ${moods.map((m,i) => `<button class="quick-btn" style="font-size:16px;padding:10px 15px;" onclick="selectMood('${moodEmojis[i]}','${m}')">${m}</button>`).join('')}
        </div><button class="close-btn" onclick="this.closest('.sticker-modal').remove()">关闭</button></div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e){ if(e.target === modal) modal.remove(); });
    playClickSound();
}
function selectMood(emoji, mood){
    document.querySelector('.sticker-modal')?.remove();
    let responses = {'😊':['太棒了！保持这份快乐～','看到你开心我也软软开心🥳','快乐是最好的魔法！'],'🙂':['还不错就是很好呀～','平平淡淡也是幸福呢','愿你每天都有小确幸～'],'😐':['抱抱～要不要我讲个笑话？','来和我聊聊天吧～','偶尔平淡也没关系'],'😢':['别难过，我陪着你🫂','想哭就哭吧，我会一直在','难过的事情都会过去的～'],'😡':['深呼吸～消消气','别让坏情绪停留太久哦','来，我陪你放松一下～']};
    let reply = responses[emoji] ? responses[emoji][Math.floor(Math.random()*3)] : '我一直在这里陪你～';
    out.innerHTML = `小蝾螈werok：${reply} ${emoji}<button class="speak-btn" onclick="speakText(this.parentElement.textContent)" title="朗读">🔊</button>`;
    unlockSticker('📔'); incrementInteractions();
}

// 语音朗读 (童真)
function speakText(text){
    if(!('speechSynthesis' in window)){ showToast('浏览器不支持语音朗读 😅'); return; }
    let cleanText = text.replace(/小蝾螈werok：/g,'').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'').trim();
    if(!cleanText) return;
    window.speechSynthesis.cancel();
    let utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'zh-CN';
    utterance.pitch = 1.8;
    utterance.rate = 0.9;
    utterance.volume = 0.9;
    let setVoice = () => {
        let voices = window.speechSynthesis.getVoices();
        let kidVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('小') || v.name.includes('童') || v.name.includes('孩')));
        if(kidVoice) utterance.voice = kidVoice;
        else {
            let femaleVoice = voices.find(v => v.lang.includes('zh') && v.name.includes('Female'));
            if(femaleVoice) utterance.voice = femaleVoice;
        }
        window.speechSynthesis.speak(utterance);
    };
    let voices = window.speechSynthesis.getVoices();

function startGame(){
    let gameArea = document.getElementById('gameArea'); gameArea.classList.add('active');
    gameTarget = Math.floor(Math.random()*100)+1; gameGuesses = 0;
    document.getElementById('gameHint').textContent = ''; document.getElementById('gameCount').textContent = '剩余次数：7';
    document.getElementById('gameInput').value = ''; document.getElementById('gameInput').focus();
    playClickSound(); showToast('我想了一个 1-100 的数字，来猜猜看！🎯');
}
function guessNumber(){
    let input = document.getElementById('gameInput'), guess = parseInt(input.value);
    let hint = document.getElementById('gameHint'), countDisplay = document.getElementById('gameCount');
    if(isNaN(guess)||guess<1||guess>100){ hint.textContent='请输入 1-100 之间的数字哦～'; return; }
    gameGuesses++; let remaining = 7 - gameGuesses;
    if(guess === gameTarget){
        hint.textContent=`🎉 太棒了！就是 ${gameTarget}！你用了 ${gameGuesses} 次猜对了！`; countDisplay.textContent='';
        triggerEmojiRain('🎉🥳✨🎊💖🌟',30); unlockSticker('🎯'); setTimeout(closeGame,2000);
    }else if(gameGuesses >=7){
        hint.textContent=`😢 机会用完啦～答案是 ${gameTarget}，下次加油哦！`; countDisplay.textContent=''; setTimeout(closeGame,2000);
    }else if(guess < gameTarget){ hint.textContent='⬆️ 太小了，往大猜！'; countDisplay.textContent=`剩余次数：${remaining}`; }
    else{ hint.textContent='⬇️ 太大了，往小猜！'; countDisplay.textContent=`剩余次数：${remaining}`; }
    input.value=''; input.focus(); playClickSound();
}
function closeGame(){ document.getElementById('gameArea').classList.remove('active'); }
